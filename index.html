<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fishing Wizard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    touch-action: none;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ============================================================
// FISHING WIZARD — Phase 1.3
// Resolution: 640x360 (16:9 landscape, scales to fill screen)
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- Scaling ---
const GAME_W = 640, GAME_H = 360;
let scale = 1, offsetX = 0, offsetY = 0;
function resize() {
  const ws = window.innerWidth / GAME_W;
  const hs = window.innerHeight / GAME_H;
  scale = Math.min(ws, hs);
  canvas.width = GAME_W;
  canvas.height = GAME_H;
  canvas.style.width = (GAME_W * scale) + 'px';
  canvas.style.height = (GAME_H * scale) + 'px';
  offsetX = (window.innerWidth - GAME_W * scale) / 2;
  offsetY = (window.innerHeight - GAME_H * scale) / 2;
  canvas.style.marginLeft = offsetX + 'px';
  canvas.style.marginTop = offsetY + 'px';
}
window.addEventListener('resize', resize);
resize();

function toGameX(cx) { return (cx - offsetX) / scale; }
function toGameY(cy) { return (cy - offsetY) / scale; }

// ============================================================
// WORLD CONFIG
// ============================================================
const WORLD_W = 2800;
const WATER_Y = 110; // water surface y
const FLOOR_Y = 330;
const SHORE_X = 200;  // shore / dock x

// ============================================================
// FISH TYPES
// ============================================================
const FISH_TYPES = [
  { name:'Minnow',     color:'#a8d8ea', size:8,  hp:1,  speed:0.6, minDepth:0,   maxDepth:60,  scales:2,  zone:0 },
  { name:'Sardine',    color:'#c7e8fa', size:10, hp:2,  speed:0.8, minDepth:0,   maxDepth:80,  scales:3,  zone:0 },
  { name:'Perch',      color:'#f4a261', size:13, hp:4,  speed:0.5, minDepth:20,  maxDepth:120, scales:6,  zone:0 },
  { name:'Bass',       color:'#2a9d8f', size:15, hp:7,  speed:0.6, minDepth:30,  maxDepth:150, scales:10, zone:1 },
  { name:'Catfish',    color:'#6d6875', size:18, hp:10, speed:0.4, minDepth:60,  maxDepth:180, scales:15, zone:1 },
  { name:'Snapper',    color:'#e76f51', size:14, hp:8,  speed:0.9, minDepth:50,  maxDepth:160, scales:18, zone:1 },
  { name:'Tuna',       color:'#457b9d', size:22, hp:18, speed:1.1, minDepth:80,  maxDepth:200, scales:28, zone:2 },
  { name:'Swordfish',  color:'#1d3557', size:26, hp:25, speed:1.3, minDepth:100, maxDepth:220, scales:40, zone:2 },
  { name:'Anglerfish', color:'#4a0e8f', size:20, hp:30, speed:0.7, minDepth:140, maxDepth:240, scales:55, zone:2 },
  { name:'Pufferfish', color:'#e9c46a', size:16, hp:12, speed:0.3, minDepth:40,  maxDepth:180, scales:20, zone:1 },
];

// ============================================================
// UPGRADES CATALOG
// ============================================================
const UPGRADES = [
  { id:'boat_speed_1',   name:'Faster Oars',     desc:'Boat speed +30%',   cost:40,  category:'boat',   maxLevel:1 },
  { id:'boat_speed_2',   name:'Wind Sails',      desc:'Boat speed +50%',   cost:120, category:'boat',   maxLevel:1, requires:'boat_speed_1' },
  { id:'inventory_1',    name:'Bigger Basket',   desc:'Carry 5 more fish', cost:50,  category:'boat',   maxLevel:1 },
  { id:'inventory_2',    name:'Magic Satchel',   desc:'Carry 10 more fish',cost:150, category:'boat',   maxLevel:1, requires:'inventory_1' },
  { id:'spell_power_1',  name:'Focused Flame',   desc:'Fireball dmg +25%', cost:60,  category:'spells', maxLevel:1 },
  { id:'spell_power_2',  name:'Arcane Surge',    desc:'Fireball dmg +50%', cost:180, category:'spells', maxLevel:1, requires:'spell_power_1' },
  { id:'spell_depth_1',  name:'Deep Cast',       desc:'Spell range deeper',cost:80,  category:'spells', maxLevel:1 },
  { id:'hat_pointy',     name:'Pointy Hat',      desc:'+5% Scales earned', cost:70,  category:'outfits',maxLevel:1 },
  { id:'hat_captain',    name:"Captain's Hat",   desc:'+10% boat speed',   cost:130, category:'outfits',maxLevel:1 },
  { id:'robe_fancy',     name:'Fancy Robes',     desc:'+10% fish value',   cost:200, category:'outfits',maxLevel:1 },
];

// ============================================================
// GAME STATE
// ============================================================
const state = {
  camera: 0,          // world scroll x
  scales: 20,
  inventory: [],      // { type, count } array
  maxInventory: 10,
  hp: 5, maxHp: 5,
  ownedUpgrades: [],
  // supply/demand tracking per fish
  salesHistory: {},   // fishName -> [timestamps]

  // Shop panel — full-screen slide-up
  shopOpen: false,
  shopSlide: 0,       // 0 = fully hidden, 1 = fully shown (animated)
  shopTab: 'sell',    // 'sell' | 'upgrades'
  shopScrollY: 0,     // scroll offset for upgrade list
  shopScrollDrag: null, // { startY, startScrollY }

  // Boat
  boat: { x: 400, y: WATER_Y - 12, vx: 0, tilt: 0, bobTimer: 0 },
  boatSpeed: 1.4,

  // Spell
  activeFirball: null,
  castStart: null,
  particles: [],
  damageNumbers: [],

  // Fish
  fish: [],

  // Clouds & env
  clouds: [],
  bubbles: [],

  // Touch
  leftTouchId: null,
  rightTouchId: null,
  castTouchId: null,
  castTouchPos: null,

  // Keyboard
  keys: {},

  // Fishmonger dialogue
  dialogue: null,
  dialogueTimer: 0,

  // UI
  lastSaleTime: 0,
  notification: null,
  notifTimer: 0,

  // Seaweed positions
  seaweeds: [],
  lightRays: [],
};

// Init env
for (let i = 0; i < 20; i++) {
  state.clouds.push({
    x: Math.random() * WORLD_W,
    y: 15 + Math.random() * 40,
    speed: 0.1 + Math.random() * 0.15,
    w: 50 + Math.random() * 90,
    h: 18 + Math.random() * 20,
    alpha: 0.6 + Math.random() * 0.3
  });
}
for (let i = 0; i < 60; i++) {
  state.bubbles.push({
    x: SHORE_X + 50 + Math.random() * (WORLD_W - SHORE_X - 100),
    y: WATER_Y + 30 + Math.random() * (FLOOR_Y - WATER_Y - 40),
    r: 1 + Math.random() * 2,
    speed: 0.3 + Math.random() * 0.5,
    wobble: Math.random() * Math.PI * 2,
  });
}
for (let i = 0; i < 25; i++) {
  state.seaweeds.push({
    x: SHORE_X + 100 + Math.random() * (WORLD_W - SHORE_X - 200),
    h: 15 + Math.random() * 35,
    phase: Math.random() * Math.PI * 2,
    segments: 4 + Math.floor(Math.random() * 4),
  });
}
for (let i = 0; i < 8; i++) {
  state.lightRays.push({
    x: SHORE_X + 200 + Math.random() * (WORLD_W - SHORE_X - 400),
    angle: -0.15 + Math.random() * 0.3,
    width: 15 + Math.random() * 30,
    alpha: 0.03 + Math.random() * 0.04,
  });
}

function spawnFish() {
  const available = WORLD_W - SHORE_X - 100;
  for (let i = 0; i < 20; i++) {
    const type = FISH_TYPES[Math.floor(Math.random() * FISH_TYPES.length)];
    const depth = type.minDepth + Math.random() * (type.maxDepth - type.minDepth);
    state.fish.push({
      type,
      x: SHORE_X + 80 + Math.random() * available,
      y: WATER_Y + depth,
      vx: (Math.random() > 0.5 ? 1 : -1) * type.speed,
      hp: type.hp,
      maxHp: type.hp,
      stunTimer: 0,
      floating: false,
      floatY: 0,
      floatTimer: 0,
      flashTimer: 0,
      collected: false,
      collectAnim: 0,
    });
  }
}
spawnFish();

// ============================================================
// HELPERS
// ============================================================
function notify(msg, color='#ffd700') {
  state.notification = { msg, color };
  state.notifTimer = 120;
}

function getEffectiveBoatSpeed() {
  let s = state.boatSpeed;
  if (state.ownedUpgrades.includes('boat_speed_1')) s *= 1.3;
  if (state.ownedUpgrades.includes('boat_speed_2')) s *= 1.5;
  if (state.ownedUpgrades.includes('hat_captain')) s *= 1.1;
  return s;
}

function getEffectiveInventoryCap() {
  let c = state.maxInventory;
  if (state.ownedUpgrades.includes('inventory_1')) c += 5;
  if (state.ownedUpgrades.includes('inventory_2')) c += 10;
  return c;
}

function getEffectiveSpellDamage() {
  let d = 1;
  if (state.ownedUpgrades.includes('spell_power_1')) d *= 1.25;
  if (state.ownedUpgrades.includes('spell_power_2')) d *= 1.5;
  return d;
}

function getEffectiveSpellDepth() {
  let d = 200;
  if (state.ownedUpgrades.includes('spell_depth_1')) d = 280;
  return d;
}

function fishScaleValue(fish) {
  let v = fish.type.scales;
  if (state.ownedUpgrades.includes('hat_pointy')) v = Math.ceil(v * 1.05);
  if (state.ownedUpgrades.includes('robe_fancy')) v = Math.ceil(v * 1.1);
  // Supply/demand penalty
  const hist = state.salesHistory[fish.type.name] || [];
  const now = Date.now();
  const recent = hist.filter(t => now - t < 120000).length;
  const penalty = Math.max(0.5, 1 - recent * 0.08);
  return Math.max(1, Math.round(v * penalty));
}

function totalInventoryCount() {
  return state.inventory.reduce((s, e) => s + e.count, 0);
}

function addToInventory(fishType) {
  const cap = getEffectiveInventoryCap();
  if (totalInventoryCount() >= cap) return false;
  const existing = state.inventory.find(e => e.type.name === fishType.name);
  if (existing) existing.count++;
  else state.inventory.push({ type: fishType, count: 1 });
  return true;
}

function upgradeUnlocked(upg) {
  if (!upg.requires) return true;
  return state.ownedUpgrades.includes(upg.requires);
}

function purchaseUpgrade(upg) {
  if (state.ownedUpgrades.includes(upg.id)) return;
  if (!upgradeUnlocked(upg)) { notify("Need prerequisite first!", '#ff6b6b'); return; }
  if (state.scales < upg.cost) { notify("Not enough Scales!", '#ff6b6b'); return; }
  state.scales -= upg.cost;
  state.ownedUpgrades.push(upg.id);
  notify(`Bought: ${upg.name}!`, '#7fff7f');
}

function sellAll() {
  if (state.inventory.length === 0) { notify("No fish to sell!", '#ff6b6b'); return; }
  let earned = 0;
  const now = Date.now();
  for (const entry of state.inventory) {
    const perFish = fishScaleValue({ type: entry.type });
    earned += perFish * entry.count;
    if (!state.salesHistory[entry.type.name]) state.salesHistory[entry.type.name] = [];
    for (let i = 0; i < entry.count; i++) state.salesHistory[entry.type.name].push(now);
  }
  state.inventory = [];
  state.scales += earned;
  state.lastSaleTime = now;
  notify(`Sold for ${earned} Scales! 🐟`, '#ffd700');
  showDialogue(FISHMONGER_LINES[Math.floor(Math.random() * FISHMONGER_LINES.length)]);
}

function sellOne(entry) {
  const val = fishScaleValue({ type: entry.type });
  state.scales += val;
  const now = Date.now();
  if (!state.salesHistory[entry.type.name]) state.salesHistory[entry.type.name] = [];
  state.salesHistory[entry.type.name].push(now);
  entry.count--;
  if (entry.count <= 0) state.inventory = state.inventory.filter(e => e.count > 0);
  notify(`+${val} Scales`, '#ffd700');
}

const FISHMONGER_LINES = [
  "Fin-tastic haul, wizard!",
  "You're quite the reel deal!",
  "I'm hooked on your catches!",
  "Scale-cellent work today!",
  "You've got a knack for this, net-wise.",
  "Don't flounder now — keep fishin'!",
  "Shore thing! Come back anytime.",
  "That's some gill-ty pleasure right there.",
];

function showDialogue(line) {
  state.dialogue = line;
  state.dialogueTimer = 180;
}

// ============================================================
// SPAWN / RESPAWN
// ============================================================
function checkRespawn() {
  const alive = state.fish.filter(f => !f.collected).length;
  if (alive < 15) {
    for (let i = 0; i < 8; i++) {
      const type = FISH_TYPES[Math.floor(Math.random() * FISH_TYPES.length)];
      const depth = type.minDepth + Math.random() * (type.maxDepth - type.minDepth);
      state.fish.push({
        type,
        x: SHORE_X + 150 + Math.random() * (WORLD_W - SHORE_X - 200),
        y: WATER_Y + depth,
        vx: (Math.random() > 0.5 ? 1 : -1) * type.speed,
        hp: type.hp,
        maxHp: type.hp,
        stunTimer: 0,
        floating: false,
        floatY: 0,
        floatTimer: 0,
        flashTimer: 0,
        collected: false,
        collectAnim: 0,
      });
    }
  }
}

// ============================================================
// INPUT
// ============================================================

// BUTTONS (screen coords in game space)
function getButtons() {
  return {
    left:  { x:12,  y:GAME_H-50, w:44, h:38 },
    right: { x:62,  y:GAME_H-50, w:44, h:38 },
    cast:  { x:GAME_W-70, y:GAME_H-60, w:58, h:50 },
    shop:  { x:GAME_W-50, y:4, w:44, h:22 },
  };
}

function inBtn(btn, gx, gy) {
  return gx >= btn.x && gx <= btn.x+btn.w && gy >= btn.y && gy <= btn.y+btn.h;
}

// Touch
function handleTouchStart(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const gx = toGameX(t.clientX), gy = toGameY(t.clientY);

    // Shop panel interactions
    if (state.shopOpen || state.shopSlide > 0.1) {
      const slideY = GAME_H * (1 - state.shopSlide);
      if (gy > slideY) {
        // Start scroll drag tracking
        state.shopScrollDrag = { id: t.identifier, startY: gy, startScrollY: state.shopScrollY };
        return;
      }
      // Tap above the panel while open = close
      if (state.shopOpen) { toggleShop(); return; }
    }

    const btns = getButtons();
    if (inBtn(btns.left, gx, gy))  { state.leftTouchId  = t.identifier; continue; }
    if (inBtn(btns.right, gx, gy)) { state.rightTouchId = t.identifier; continue; }
    if (inBtn(btns.shop, gx, gy))  { toggleShop(); continue; }
    if (inBtn(btns.cast, gx, gy) || gx > GAME_W/2) {
      if (!state.activeFirball) {
        beginCast(gx, gy, t.identifier);
      } else {
        state.castTouchId = t.identifier;
        state.castTouchPos = { x:gx, y:gy };
      }
    }
  }
}
function handleTouchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const gx = toGameX(t.clientX), gy = toGameY(t.clientY);
    if (state.shopScrollDrag && t.identifier === state.shopScrollDrag.id) {
      const delta = state.shopScrollDrag.startY - gy;
      const maxScroll = state.shopTab === 'sell'
        ? Math.max(0, state.inventory.length * 36 - (GAME_H - 120))
        : Math.max(0, UPGRADES.length * 38 + 3 * 32 - (GAME_H - 120));
      state.shopScrollY = Math.max(0, Math.min(maxScroll, state.shopScrollDrag.startScrollY + delta));
    }
    if (t.identifier === state.castTouchId) {
      state.castTouchPos = { x:gx, y:gy };
    }
  }
}
function handleTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (state.shopScrollDrag && t.identifier === state.shopScrollDrag.id) {
      // If barely moved = it was a tap, not a scroll
      const slideY = GAME_H * (1 - state.shopSlide);
      const gx = toGameX(t.clientX), gy = toGameY(t.clientY);
      const moved = Math.abs(gy - state.shopScrollDrag.startY);
      if (moved < 6) handleShopTap(gx, gy, t.identifier);
      state.shopScrollDrag = null;
    }
    if (t.identifier === state.leftTouchId)  state.leftTouchId  = null;
    if (t.identifier === state.rightTouchId) state.rightTouchId = null;
    if (t.identifier === state.castTouchId) {
      state.castTouchId = null;
      state.castTouchPos = null;
    }
  }
}
canvas.addEventListener('touchstart', handleTouchStart, { passive:false });
canvas.addEventListener('touchmove', handleTouchMove, { passive:false });
canvas.addEventListener('touchend', handleTouchEnd, { passive:false });
canvas.addEventListener('touchcancel', handleTouchEnd, { passive:false });

// Mouse (desktop)
let mouseDown = false, mouseTouchId = 99;
let mouseShopDrag = null;
canvas.addEventListener('mousedown', e => {
  const gx = toGameX(e.clientX), gy = toGameY(e.clientY);
  if (state.shopOpen || state.shopSlide > 0.1) {
    const slideY = GAME_H * (1 - state.shopSlide);
    if (gy > slideY) {
      mouseShopDrag = { startY: gy, startScrollY: state.shopScrollY };
      return;
    }
    if (state.shopOpen) { toggleShop(); return; }
  }
  const btns = getButtons();
  if (inBtn(btns.shop, gx, gy)) { toggleShop(); return; }
  mouseDown = true;
  if (!state.activeFirball) beginCast(gx, gy, mouseTouchId);
  else { state.castTouchId = mouseTouchId; state.castTouchPos={x:gx,y:gy}; }
});
canvas.addEventListener('mousemove', e => {
  const gx = toGameX(e.clientX), gy = toGameY(e.clientY);
  if (mouseShopDrag) {
    const delta = mouseShopDrag.startY - gy;
    const maxScroll = state.shopTab === 'sell'
      ? Math.max(0, state.inventory.length * 36 - (GAME_H - 120))
      : Math.max(0, UPGRADES.length * 38 + 3 * 32 - (GAME_H - 120));
    state.shopScrollY = Math.max(0, Math.min(maxScroll, mouseShopDrag.startScrollY + delta));
  }
  if (state.castTouchId === mouseTouchId) {
    state.castTouchPos = { x:gx, y:gy };
  }
});
canvas.addEventListener('mouseup', e => {
  if (mouseShopDrag) {
    const gx = toGameX(e.clientX), gy = toGameY(e.clientY);
    const moved = Math.abs(gy - mouseShopDrag.startY);
    if (moved < 6) handleShopTap(gx, gy, -1);
    mouseShopDrag = null;
    return;
  }
  mouseDown = false;
  if (state.castTouchId === mouseTouchId) { state.castTouchId=null; state.castTouchPos=null; }
});

// Keyboard
window.addEventListener('keydown', e => { state.keys[e.key] = true; });
window.addEventListener('keyup', e => { state.keys[e.key] = false; });

// ============================================================
// CAST SPELL
// ============================================================
function beginCast(gx, gy, tid) {
  // Only cast into water area
  if (gy < WATER_Y - 5 || gy > FLOOR_Y) return;
  const worldX = gx + state.camera;
  const worldY = gy;
  state.activeFirball = {
    x: state.boat.x,
    y: state.boat.y - 5,
    targetX: worldX,
    targetY: worldY,
    speed: 3.5,
    life: 1.0,
  };
  state.castTouchId = tid;
  state.castTouchPos = { x:gx, y:gy };
}

// ============================================================
// SHOP
// ============================================================
function toggleShop() {
  const nearShore = state.boat.x < SHORE_X + 120;
  if (!state.shopOpen && !nearShore) {
    notify("Return to shore to sell!", '#ff9f43');
    return;
  }
  state.shopOpen = !state.shopOpen;
  state.shopScrollY = 0;
  if (state.shopOpen) {
    showDialogue(FISHMONGER_LINES[Math.floor(Math.random() * FISHMONGER_LINES.length)]);
  }
}

// Shop panel is full-screen — no fixed layout object needed

function handleShopTap(gx, gy, tid) {
  const slideY = GAME_H * (1 - state.shopSlide);
  const panelTop = slideY;          // top of sliding panel
  const headerH = 48;               // top bar with tabs + close
  const tabW = (GAME_W) / 2;

  // Close button (top-right X)
  if (gx > GAME_W - 36 && gy > panelTop + 6 && gy < panelTop + headerH - 6) {
    toggleShop(); return;
  }

  // Tab switching
  if (gy > panelTop + 4 && gy < panelTop + headerH) {
    if (gx < tabW) { state.shopTab = 'sell'; state.shopScrollY = 0; return; }
    else            { state.shopTab = 'upgrades'; state.shopScrollY = 0; return; }
  }

  const contentTop = panelTop + headerH;

  if (state.shopTab === 'sell') {
    // Sell All button — bottom strip
    const sellAllY = GAME_H - 32;
    if (gy > sellAllY && gy < GAME_H - 4) { sellAll(); return; }

    // Individual rows
    const rowH = 36;
    state.inventory.forEach((entry, i) => {
      const ry = contentTop + 4 + i * rowH - state.shopScrollY;
      if (ry < contentTop - rowH || ry > GAME_H) return;
      // Sell-one tap zone (right 80px)
      if (gy > ry + 2 && gy < ry + rowH - 2 && gx > GAME_W - 90) {
        sellOne(entry);
      }
    });

  } else {
    // Upgrades — tap buy buttons
    let rowY = contentTop + 4 - state.shopScrollY;
    const catNames = ['boat','spells','outfits'];
    const catLabels = { boat:'⚓  BOAT', spells:'🔥 SPELLS', outfits:'🧙 OUTFITS' };
    catNames.forEach(cat => {
      rowY += 26; // header row
      const catUpgs = UPGRADES.filter(u => u.category === cat);
      catUpgs.forEach(upg => {
        const rowH = 38;
        // Buy button zone: right 90px, within this row
        if (gy > rowY + 4 && gy < rowY + rowH - 4 && gx > GAME_W - 96) {
          purchaseUpgrade(upg);
        }
        rowY += rowH;
      });
      rowY += 6;
    });
  }
}

// ============================================================
// UPDATE
// ============================================================
let lastTime = 0;
function update(dt) {
  const boat = state.boat;
  const spd = getEffectiveBoatSpeed();

  // --- Boat movement ---
  if (!state.shopOpen) {
    let moveX = 0;
    if (state.leftTouchId !== null || state.keys['ArrowLeft'] || state.keys['a'] || state.keys['A']) moveX -= spd;
    if (state.rightTouchId !== null || state.keys['ArrowRight'] || state.keys['d'] || state.keys['D']) moveX += spd;
    boat.vx = moveX;
    boat.x += boat.vx;
    boat.x = Math.max(SHORE_X + 20, Math.min(WORLD_W - 60, boat.x));
    boat.tilt = boat.vx * 0.08;
  }

  // Bob
  boat.bobTimer += 0.04;
  boat.y = WATER_Y - 12 + Math.sin(boat.bobTimer) * 2.5;

  // --- Camera ---
  const targetCam = boat.x - GAME_W / 2.2;
  state.camera += (targetCam - state.camera) * 0.08;
  state.camera = Math.max(0, Math.min(WORLD_W - GAME_W, state.camera));

  // --- Fireball ---
  if (state.activeFirball) {
    const fb = state.activeFirball;
    // Steer toward finger
    if (state.castTouchPos) {
      fb.targetX = state.castTouchPos.x + state.camera;
      fb.targetY = state.castTouchPos.y;
    }
    const dx = fb.targetX - fb.x, dy = fb.targetY - fb.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if (dist > 3) {
      fb.x += (dx/dist) * fb.speed;
      fb.y += (dy/dist) * fb.speed;
    }
    // Depth-based life drain
    const depth = fb.y - WATER_Y;
    const maxDepth = getEffectiveSpellDepth();
    fb.life -= 0.003 + (depth / maxDepth) * 0.004;

    // Particles
    state.particles.push({
      x: fb.x, y: fb.y,
      vx: (Math.random()-0.5)*1.5,
      vy: (Math.random()-0.5)*1.5 - 0.5,
      r: 3 + Math.random()*3,
      life: 1,
      color: `hsl(${20+Math.random()*30},100%,${50+Math.random()*20}%)`
    });

    // Hit fish
    state.fish.forEach(f => {
      if (f.floating || f.collected) return;
      const fdx = fb.x - f.x, fdy = fb.y - f.y;
      if (Math.sqrt(fdx*fdx+fdy*fdy) < f.type.size + 6) {
        const dmg = getEffectiveSpellDamage();
        f.hp -= dmg;
        f.flashTimer = 8;
        f.stunTimer = 60;
        state.damageNumbers.push({ x:f.x, y:f.y-f.type.size, val:Math.ceil(dmg), life:1 });
        if (f.hp <= 0) {
          f.floating = true;
          f.floatY = f.y;
          f.floatTimer = 0;
          f.vx = 0;
        }
        fb.life -= 0.3;
      }
    });

    if (fb.life <= 0 || fb.y > FLOOR_Y || fb.x < 0 || fb.x > WORLD_W) {
      state.activeFirball = null;
      state.castTouchId = null;
      state.castTouchPos = null;
    }
  }

  // --- Particles ---
  state.particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.life -= 0.04;
  });
  state.particles = state.particles.filter(p => p.life > 0);

  // --- Damage numbers ---
  state.damageNumbers.forEach(d => { d.y -= 0.7; d.life -= 0.025; });
  state.damageNumbers = state.damageNumbers.filter(d => d.life > 0);

  // --- Fish AI ---
  state.fish.forEach(f => {
    if (f.collected) return;
    if (f.floating) {
      // Float to surface
      f.floatTimer++;
      const targetY = WATER_Y - f.type.size * 0.4;
      f.y += (targetY - f.y) * 0.05;
      return;
    }
    f.flashTimer = Math.max(0, f.flashTimer - 1);
    f.stunTimer = Math.max(0, f.stunTimer - 1);
    if (f.stunTimer > 0) return;
    // Swim
    f.x += f.vx;
    // Bounce off walls
    if (f.x < SHORE_X + 40) { f.vx = Math.abs(f.vx); }
    if (f.x > WORLD_W - 40) { f.vx = -Math.abs(f.vx); }
    // Random direction changes
    if (Math.random() < 0.005) f.vx *= -1;
  });

  // --- Tap floating fish to collect ---
  // (handled in tap logic below)

  // --- Bubbles ---
  state.bubbles.forEach(b => {
    b.y -= b.speed;
    b.wobble += 0.05;
    b.x += Math.sin(b.wobble) * 0.3;
    if (b.y < WATER_Y) b.y = FLOOR_Y - 5;
  });

  // --- Clouds ---
  state.clouds.forEach(c => {
    c.x += c.speed;
    if (c.x > WORLD_W + 200) c.x = -200;
  });

  // --- Dialogue ---
  if (state.dialogueTimer > 0) state.dialogueTimer--;
  if (state.dialogueTimer <= 0) state.dialogue = null;

  // --- Notification ---
  if (state.notifTimer > 0) state.notifTimer--;

  // --- Respawn ---
  checkRespawn();
  state.fish = state.fish.filter(f => !f.collected || f.collectAnim < 1);
  state.fish.forEach(f => { if (f.collected) f.collectAnim += 0.08; });

  // --- Shop slide animation ---
  const slideTarget = state.shopOpen ? 1 : 0;
  state.shopSlide += (slideTarget - state.shopSlide) * 0.18;
  if (Math.abs(state.shopSlide - slideTarget) < 0.001) state.shopSlide = slideTarget;

  // --- Shop proximity auto-open hint ---
  if (state.boat.x < SHORE_X + 80 && !state.shopOpen && totalInventoryCount() > 0 && Date.now() - state.lastSaleTime > 5000) {
    // Just a subtle cue — could show here
  }
}

// Tap to collect fish
function tapCollect(gx, gy) {
  const wx = gx + state.camera;
  const wy = gy;
  for (const f of state.fish) {
    if (!f.floating || f.collected) continue;
    const dx = wx - f.x, dy = wy - f.y;
    if (Math.sqrt(dx*dx+dy*dy) < f.type.size + 14) {
      const cap = getEffectiveInventoryCap();
      if (totalInventoryCount() >= cap) {
        notify("Inventory full! Head to shore.", '#ff9f43');
        return;
      }
      f.collected = true;
      addToInventory(f.type);
      state.damageNumbers.push({ x:f.x, y:f.y-f.type.size-6, val:'+1', life:1.5, color:'#7fff7f' });
      return;
    }
  }
}

// Intercept taps on canvas for fish collection
canvas.addEventListener('click', e => {
  if (state.shopOpen) return;
  tapCollect(toGameX(e.clientX), toGameY(e.clientY));
});

// Also on touchend for mobile fish collection
canvas.addEventListener('touchend', e => {
  if (state.shopOpen) return;
  for (const t of e.changedTouches) {
    if (t.identifier !== state.leftTouchId && t.identifier !== state.rightTouchId) {
      tapCollect(toGameX(t.clientX), toGameY(t.clientY));
    }
  }
}, { passive:false });

function drawRoundRect(x,y,w,h,r,fill,stroke,strokeW=1) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
  if (fill) { ctx.fillStyle=fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=strokeW; ctx.stroke(); }
}

function drawSky() {
  const grad = ctx.createLinearGradient(0,0,0,WATER_Y);
  grad.addColorStop(0,'#0a1628');
  grad.addColorStop(0.4,'#1a3a6b');
  grad.addColorStop(1,'#2e6ba8');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,GAME_W,WATER_Y);
}

function drawClouds() {
  state.clouds.forEach(c => {
    const sx = c.x - state.camera;
    if (sx < -200 || sx > GAME_W+200) return;
    ctx.globalAlpha = c.alpha * 0.7;
    ctx.fillStyle = '#c8e6ff';
    ctx.beginPath();
    ctx.ellipse(sx, c.y, c.w, c.h*0.5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(sx-c.w*0.25, c.y+2, c.w*0.55, c.h*0.4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(sx+c.w*0.28, c.y+4, c.w*0.45, c.h*0.38, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawOcean() {
  // Ocean body
  const grad = ctx.createLinearGradient(0, WATER_Y, 0, FLOOR_Y);
  grad.addColorStop(0,'#0d4f8b');
  grad.addColorStop(0.4,'#083566');
  grad.addColorStop(1,'#041f3e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, WATER_Y, GAME_W, FLOOR_Y - WATER_Y);

  // Sandy floor
  const floorGrad = ctx.createLinearGradient(0, FLOOR_Y-10, 0, GAME_H);
  floorGrad.addColorStop(0,'#c4a265');
  floorGrad.addColorStop(1,'#a07850');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, FLOOR_Y, GAME_W, GAME_H - FLOOR_Y);

  // Light rays
  state.lightRays.forEach(r => {
    const rx = r.x - state.camera;
    if (rx < -100 || rx > GAME_W + 100) return;
    ctx.save();
    ctx.translate(rx, WATER_Y);
    ctx.rotate(r.angle);
    const rg = ctx.createLinearGradient(0,0,0,FLOOR_Y-WATER_Y);
    rg.addColorStop(0, `rgba(100,200,255,${r.alpha*1.5})`);
    rg.addColorStop(1, 'rgba(100,200,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(-r.width/2, 0);
    ctx.lineTo(r.width/2, 0);
    ctx.lineTo(r.width*1.5, FLOOR_Y-WATER_Y);
    ctx.lineTo(-r.width*1.5, FLOOR_Y-WATER_Y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  // Seaweed
  state.seaweeds.forEach(sw => {
    const sx = sw.x - state.camera;
    if (sx < -20 || sx > GAME_W+20) return;
    ctx.strokeStyle = '#1a7a3a';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    let cx = sx, cy = FLOOR_Y;
    ctx.moveTo(cx, cy);
    for (let s=0; s<sw.segments; s++) {
      const t = (s+1)/sw.segments;
      const segH = sw.h / sw.segments;
      cx = sx + Math.sin(sw.phase + t*3 + Date.now()*0.001) * 6;
      cy = FLOOR_Y - t * sw.h;
      ctx.lineTo(cx, cy);
    }
    ctx.stroke();
    // Tip bulb
    ctx.fillStyle = '#2ecc71';
    ctx.beginPath();
    ctx.ellipse(cx, cy, 3.5, 5, 0.3, 0, Math.PI*2);
    ctx.fill();
  });

  // Bubbles
  state.bubbles.forEach(b => {
    const bx = b.x - state.camera;
    if (bx < 0 || bx > GAME_W) return;
    ctx.strokeStyle = 'rgba(150,220,255,0.5)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.arc(bx, b.y, b.r, 0, Math.PI*2);
    ctx.stroke();
  });

  // Wave shimmer on surface
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1.5;
  for (let i=0; i<8; i++) {
    const wx = ((i * 90) - (state.camera * 0.3) % (GAME_W+200));
    ctx.beginPath();
    ctx.moveTo(wx, WATER_Y+1);
    ctx.quadraticCurveTo(wx+20, WATER_Y-3, wx+40, WATER_Y+1);
    ctx.stroke();
  }
}

function drawFish() {
  state.fish.forEach(f => {
    if (f.collected) {
      const sc = 1 + f.collectAnim * 0.5;
      const al = 1 - f.collectAnim;
      ctx.globalAlpha = al;
      ctx.save();
      ctx.translate(f.x - state.camera, f.y);
      ctx.scale(sc, sc);
      drawFishShape(f, 0, 0, true);
      ctx.restore();
      ctx.globalAlpha = 1;
      return;
    }

    const sx = f.x - state.camera;
    if (sx < -40 || sx > GAME_W+40) return;

    if (f.floating) {
      // Collection ring pulse
      const pulse = 0.5 + Math.sin(Date.now()*0.008) * 0.5;
      ctx.strokeStyle = `rgba(255,215,0,${0.4+pulse*0.5})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(sx, f.y, f.type.size + 8 + pulse*4, 0, Math.PI*2);
      ctx.stroke();
    }

    ctx.save();
    ctx.translate(sx, f.y);
    if (f.floating) {
      ctx.rotate(Math.PI); // belly-up
    } else {
      const tilt = f.vx > 0 ? 0.1 : -0.1;
      ctx.rotate(tilt);
      if (f.vx < 0) ctx.scale(-1, 1);
    }
    drawFishShape(f, 0, 0, false);
    ctx.restore();

    // HP bar (when damaged)
    if (!f.floating && f.hp < f.maxHp && f.flashTimer > 0) {
      const bw = f.type.size * 2.5;
      const bx = sx - bw/2, by = f.y - f.type.size - 8;
      ctx.fillStyle = '#333';
      ctx.fillRect(bx, by, bw, 4);
      ctx.fillStyle = `hsl(${(f.hp/f.maxHp)*120},90%,45%)`;
      ctx.fillRect(bx, by, bw * (f.hp/f.maxHp), 4);
    }
  });
}

function drawFishShape(f, ox, oy, ghost) {
  const s = f.type.size;
  if (f.flashTimer > 0 && !ghost) {
    ctx.fillStyle = '#fff';
  } else {
    ctx.fillStyle = f.type.color;
  }
  // Body
  ctx.beginPath();
  ctx.ellipse(ox, oy, s, s*0.55, 0, 0, Math.PI*2);
  ctx.fill();
  // Tail
  ctx.beginPath();
  ctx.moveTo(ox-s, oy);
  ctx.lineTo(ox-s-s*0.6, oy-s*0.45);
  ctx.lineTo(ox-s-s*0.6, oy+s*0.45);
  ctx.closePath();
  ctx.fill();
  // Eye
  if (!ghost) {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(ox+s*0.45, oy-s*0.1, s*0.22, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(ox+s*0.5, oy-s*0.1, s*0.11, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawBoat() {

  ctx.lineTo(22, 12);
  ctx.lineTo(-22, 12);

  ctx.fill();

  ctx.fillRect(-24, 10, 48, 3);

  // Planks
  ctx.strokeStyle = '#5c2a08';
  ctx.lineWidth = 1;
  for (let i=-20; i<20; i+=8) {
    ctx.beginPath();
    ctx.moveTo(i, 0);

  // Wizard

  ctx.fill();

  // Hat
  let hatColor = '#4a0080';

    // Captain hat

  } else {

    ctx.lineTo(9,-37);

    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffd700';

    ctx.arc(3,-57,3,0,Math.PI*2);
    ctx.fill();
    // brim
    ctx.fillStyle = hatColor;
    ctx.fillRect(-11,-41,22,5);
  }

  // Arms/casting pose
  ctx.strokeStyle = '#f5cba7';

  if (state.activeFirball) {
    // Raised casting arm
    ctx.beginPath();

    ctx.lineTo(18,-32);
    ctx.stroke();
    // Magic glow at hand
    ctx.fillStyle = 'rgba(255,150,0,0.8)';
    ctx.beginPath();
    ctx.arc(18,-32,4,0,Math.PI*2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(-7,-22); ctx.lineTo(-14,-14); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(7,-22); ctx.lineTo(14,-14); ctx.stroke();
  }

  ctx.restore();

  // Wake
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(bx-30, by+10);
  ctx.quadraticCurveTo(bx-50, by+8, bx-70, by+14);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(bx+30, by+10);
  ctx.quadraticCurveTo(bx+50, by+8, bx+70, by+14);
  ctx.stroke();
}

function drawFireball() {
  if (!state.activeFirball) return;
  const fb = state.activeFirball;
  const sx = fb.x - state.camera;
  const sy = fb.y;

  // Glow
  const grd = ctx.createRadialGradient(sx,sy,0,sx,sy,14);
  grd.addColorStop(0,'rgba(255,220,80,0.9)');
  grd.addColorStop(0.4,'rgba(255,100,0,0.5)');
  grd.addColorStop(1,'rgba(255,50,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(sx,sy,14,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(sx,sy,4,0,Math.PI*2);
  ctx.fill();
}

function drawParticles() {
  state.particles.forEach(p => {
    const sx = p.x - state.camera;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(sx, p.y, p.r * p.life, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawDamageNumbers() {
  state.damageNumbers.forEach(d => {
    const sx = d.x - state.camera;
    ctx.globalAlpha = d.life;
    ctx.font = `bold ${7 + (1-d.life)*3}px monospace`;
    ctx.fillStyle = d.color || '#ff6b35';
    ctx.textAlign = 'center';
    ctx.fillText(d.val, sx, d.y);
  });
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawUI() {
  // Top bar background
  ctx.fillStyle = 'rgba(0,0,10,0.75)';
  ctx.fillRect(0,0,GAME_W,24);

  // HP bar
  const hpBarW = 60;
  ctx.fillStyle = '#333';
  ctx.fillRect(6,5,hpBarW,9);
  const hpPct = state.hp / state.maxHp;
  const hpColor = hpPct > 0.5 ? '#2ecc71' : hpPct > 0.25 ? '#f39c12' : '#e74c3c';
  ctx.fillStyle = hpColor;
  ctx.fillRect(6,5,hpBarW*hpPct,9);
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 1;
  ctx.strokeRect(6,5,hpBarW,9);
  ctx.fillStyle = '#fff';
  ctx.font = '6px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('HP', 36, 12);

  // Fish count
  const cap = getEffectiveInventoryCap();
  const cnt = totalInventoryCount();
  ctx.fillStyle = cnt >= cap ? '#ff6b35' : '#ffd700';
  ctx.textAlign = 'left';
  ctx.font = 'bold 8px monospace';
  ctx.fillText(`🐟 ${cnt}/${cap}`, 74, 14);

  // Scales
  ctx.fillStyle = '#c0ffa0';
  ctx.fillText(`⚡${state.scales}`, 130, 14);

  // Title
  ctx.fillStyle = '#ffd700';
  ctx.textAlign = 'center';
  ctx.font = 'bold 9px monospace';
  ctx.fillText('✦ FISHING WIZARD ✦', GAME_W/2, 14);

  // Spell indicator
  ctx.fillStyle = '#ff9f43';
  ctx.textAlign = 'right';
  ctx.font = '7px monospace';
  ctx.fillText('🔥FIREBALL', GAME_W-52, 14);

  // Shop button (top right)
  const nearShore = state.boat.x < SHORE_X + 100;
  const shopBtnColor = nearShore ? 'rgba(255,215,0,0.85)' : 'rgba(100,100,100,0.6)';
  drawRoundRect(GAME_W-48, 3, 44, 18, 3, shopBtnColor, '#fff', 0.5);
  ctx.fillStyle = nearShore ? '#2c2c00' : '#aaa';
  ctx.textAlign = 'center';
  ctx.font = 'bold 7px monospace';
  ctx.fillText('SHOP', GAME_W-26, 14);
  ctx.textAlign = 'left';

  // Movement buttons
  const btns = getButtons();
  ['left','right'].forEach(dir => {
    const b = btns[dir];
    const active = dir==='left' ? state.leftTouchId!==null || state.keys['ArrowLeft'] || state.keys['a']
                                : state.rightTouchId!==null || state.keys['ArrowRight'] || state.keys['d'];
    drawRoundRect(b.x, b.y, b.w, b.h, 5, active?'rgba(255,255,255,0.35)':'rgba(255,255,255,0.15)', 'rgba(255,255,255,0.5)', 1);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 18px monospace';
    ctx.fillText(dir==='left'?'◀':'▶', b.x+b.w/2, b.y+b.h/2+7);
  });

  // Cast button
  const cb = btns.cast;
  const castActive = state.castTouchId !== null;
  drawRoundRect(cb.x, cb.y, cb.w, cb.h, 8, castActive?'rgba(255,150,0,0.5)':'rgba(255,150,0,0.25)', 'rgba(255,180,50,0.8)', 1.5);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 10px monospace';
  ctx.fillText('🔥', cb.x+cb.w/2, cb.y+cb.h/2+4);
  ctx.font = '6px monospace';
  ctx.fillText('CAST', cb.x+cb.w/2, cb.y+cb.h-6);
  ctx.textAlign = 'left';

  // Notification
  if (state.notifTimer > 0 && state.notification) {
    const al = Math.min(1, state.notifTimer/20);
    ctx.globalAlpha = al;
    const msg = state.notification.msg;
    ctx.font = 'bold 9px monospace';
    const mw = ctx.measureText(msg).width;
    drawRoundRect(GAME_W/2 - mw/2 - 8, 28, mw+16, 16, 4, 'rgba(0,0,0,0.7)', state.notification.color, 1.5);
    ctx.fillStyle = state.notification.color;
    ctx.textAlign = 'center';
    ctx.fillText(msg, GAME_W/2, 39);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // Dialogue bubble (fishmonger)
  if (state.dialogue) {
    const dy = WATER_Y - 75;
    const bx = SHORE_X - state.camera - 60;
    if (bx > -100 && bx < GAME_W + 100) {
      const al = Math.min(1, state.dialogueTimer / 30);
      ctx.globalAlpha = al;
      ctx.font = '6px monospace';
      const tw = ctx.measureText(state.dialogue).width;
      const px = Math.max(4, Math.min(GAME_W - tw - 20, bx));
      drawRoundRect(px, dy, tw+14, 14, 4, 'rgba(255,255,220,0.95)', '#8b6914', 1);
      ctx.fillStyle = '#3a2000';
      ctx.textAlign = 'left';
      ctx.fillText(state.dialogue, px+7, dy+10);
      ctx.globalAlpha = 1;
    }
  }

  // Shore prompt
  if (state.boat.x < SHORE_X + 85 && !state.shopOpen && totalInventoryCount() > 0) {
    ctx.fillStyle = 'rgba(255,215,0,0.9)';
    ctx.font = 'bold 7px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('▲ SHOP', GAME_W/2, 36);
    ctx.textAlign = 'left';
  }

  // Minimap
  const mm = { x:GAME_W-80, y:GAME_H-16, w:76, h:10 };
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(mm.x,mm.y,mm.w,mm.h);
  ctx.strokeStyle='#444'; ctx.lineWidth=1; ctx.strokeRect(mm.x,mm.y,mm.w,mm.h);
  // Boat position
  const bpx = mm.x + (state.boat.x / WORLD_W) * mm.w;
  ctx.fillStyle='#ffd700'; ctx.fillRect(bpx-1, mm.y+2, 3, mm.h-4);
  // Shore marker
  const spx = mm.x + (SHORE_X / WORLD_W) * mm.w;
  ctx.fillStyle='#c8a96e'; ctx.fillRect(spx, mm.y, 3, mm.h);
}

// ============================================================
// SHOP PANEL — Full-screen slide-up
// ============================================================
function drawShop() {
  if (state.shopSlide < 0.002) return;

  const slideY = Math.round(GAME_H * (1 - state.shopSlide));

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, slideY, GAME_W, GAME_H - slideY);
  ctx.clip();

  // Dark scrim behind panel
  ctx.fillStyle = `rgba(0,0,0,${0.55 * state.shopSlide})`;
  ctx.fillRect(0, 0, GAME_W, slideY);

  // Panel body — deep parchment-dark with texture feel
  const panelGrad = ctx.createLinearGradient(0, slideY, 0, GAME_H);
  panelGrad.addColorStop(0, '#160e24');
  panelGrad.addColorStop(1, '#0d0718');
  ctx.fillStyle = panelGrad;
  ctx.fillRect(0, slideY, GAME_W, GAME_H - slideY);

  // Gold top border line
  ctx.strokeStyle = '#c8960a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, slideY + 1);
  ctx.lineTo(GAME_W, slideY + 1);
  ctx.stroke();

  // Decorative corner flourishes
  drawCornerFlourish(8, slideY + 4, false);
  drawCornerFlourish(GAME_W - 8, slideY + 4, true);

  // ── Header bar ──
  const headerH = 48;

  // Tab backgrounds
  const tabW = GAME_W / 2;
  const sellActive = state.shopTab === 'sell';

  // Sell tab
  ctx.fillStyle = sellActive ? 'rgba(255,200,0,0.15)' : 'rgba(255,255,255,0.03)';
  ctx.fillRect(0, slideY, tabW, headerH);

  // Upgrades tab
  ctx.fillStyle = !sellActive ? 'rgba(180,100,255,0.15)' : 'rgba(255,255,255,0.03)';
  ctx.fillRect(tabW, slideY, tabW, headerH);

  // Tab divider
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(tabW, slideY + 8);
  ctx.lineTo(tabW, slideY + headerH - 8);
  ctx.stroke();

  // Active tab underline
  ctx.strokeStyle = sellActive ? '#ffd700' : '#b87fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(sellActive ? 12 : tabW + 12, slideY + headerH - 3);
  ctx.lineTo(sellActive ? tabW - 12 : GAME_W - 12, slideY + headerH - 3);
  ctx.stroke();

  // Tab labels
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = sellActive ? '#ffd700' : '#887799';
  ctx.fillText('📦  SELL', tabW / 2, slideY + headerH - 14);
  ctx.fillStyle = !sellActive ? '#b87fff' : '#887799';
  ctx.fillText('✨  UPGRADE', tabW + tabW / 2, slideY + headerH - 14);

  // Fishmonger portrait + name (sell tab)
  if (sellActive) {
    drawFishmongerPortrait(16, slideY + 6, 32);
    ctx.fillStyle = '#c8a040';
    ctx.font = '6px monospace';
    ctx.textAlign = 'left';
    ctx.fillText("Grimbold's", 52, slideY + 14);
    ctx.font = 'bold 8px monospace';
    ctx.fillStyle = '#ffd700';
    ctx.fillText('FISH MARKET', 52, slideY + 24);
    ctx.fillStyle = '#666';
    ctx.font = '5px monospace';
    ctx.fillText(`⚡ ${state.scales} Scales`, 52, slideY + 34);
  } else {
    ctx.fillStyle = '#a080cc';
    ctx.font = '6px monospace';
    ctx.textAlign = 'left';
    ctx.fillText("Arcane", tabW + 8, slideY + 14);
    ctx.font = 'bold 8px monospace';
    ctx.fillStyle = '#b87fff';
    ctx.fillText('UPGRADES', tabW + 8, slideY + 24);
    ctx.fillStyle = '#666';
    ctx.font = '5px monospace';
    ctx.fillText(`⚡ ${state.scales} Scales`, tabW + 8, slideY + 34);
  }

  // Close button
  drawCloseButton(GAME_W - 20, slideY + 14, 14);

  // Horizontal rule below header
  ctx.strokeStyle = '#2a1f3a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, slideY + headerH);
  ctx.lineTo(GAME_W, slideY + headerH);
  ctx.stroke();

  // Content area
  const contentTop = slideY + headerH + 2;

  if (state.shopTab === 'sell') {
    drawShopSellPanel(contentTop);
  } else {
    drawShopUpgradesPanel(contentTop);
  }

  ctx.restore();
}

function drawCornerFlourish(x, y, flip) {
  ctx.save();
  if (flip) ctx.transform(-1, 0, 0, 1, x * 2, 0);
  ctx.strokeStyle = '#c8960a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + 12, y);
  ctx.moveTo(x, y); ctx.lineTo(x, y + 10);
  ctx.moveTo(x + 3, y + 3); ctx.arc(x + 3, y + 6, 3, -Math.PI/2, 0);
  ctx.stroke();
  ctx.restore();
}

function drawCloseButton(cx, cy, r) {
  // Circle background
  ctx.fillStyle = 'rgba(200,50,50,0.25)';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#cc4444'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#ff8888'; ctx.lineWidth = 1.5;
  const d = r * 0.5;
  ctx.beginPath();
  ctx.moveTo(cx-d, cy-d); ctx.lineTo(cx+d, cy+d);
  ctx.moveTo(cx+d, cy-d); ctx.lineTo(cx-d, cy+d);
  ctx.stroke();
}

function drawFishmongerPortrait(x, y, size) {
  // Head
  ctx.fillStyle = '#d4956a';
  ctx.beginPath(); ctx.arc(x + size/2, y + size*0.38, size*0.28, 0, Math.PI*2); ctx.fill();
  // Hat
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(x + size*0.18, y + size*0.06, size*0.65, size*0.16);
  ctx.fillRect(x + size*0.28, y - size*0.08, size*0.44, size*0.18);
  // Eyes
  ctx.fillStyle = '#333';
  ctx.fillRect(x+size*0.34, y+size*0.30, size*0.08, size*0.08);
  ctx.fillRect(x+size*0.56, y+size*0.30, size*0.08, size*0.08);
  // Beard
  ctx.fillStyle = '#ddd';
  ctx.beginPath();
  ctx.ellipse(x+size*0.5, y+size*0.6, size*0.22, size*0.14, 0, 0, Math.PI*2);
  ctx.fill();
  // Body
  ctx.fillStyle = '#6b4226';
  ctx.fillRect(x+size*0.22, y+size*0.58, size*0.56, size*0.4);
  // Apron
  ctx.fillStyle = '#c8a84a';
  ctx.fillRect(x+size*0.3, y+size*0.6, size*0.4, size*0.36);
  // Border ring
  ctx.strokeStyle = '#c8960a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x+size/2, y+size*0.5, size*0.5, 0, Math.PI*2); ctx.stroke();
}

function drawShopSellPanel(contentTop) {
  const listBottom = GAME_H - 36;
  const rowH = 36;

  if (state.inventory.length === 0) {
    // Empty state
    ctx.textAlign = 'center';
    ctx.fillStyle = '#443355';
    ctx.font = 'bold 32px monospace';
    ctx.globalAlpha = 0.4;
    ctx.fillText('🐟', GAME_W/2, contentTop + 60);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#887799';
    ctx.font = 'bold 9px monospace';
    ctx.fillText('No fish in inventory!', GAME_W/2, contentTop + 80);
    ctx.fillStyle = '#554466';
    ctx.font = '7px monospace';
    ctx.fillText('Cast spells, collect stunned fish,', GAME_W/2, contentTop + 94);
    ctx.fillText('then return to shore to sell.', GAME_W/2, contentTop + 106);
    ctx.textAlign = 'left';
    return;
  }

  // Column headers
  ctx.fillStyle = '#554466';
  ctx.font = '6px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('FISH', 14, contentTop + 12);
  ctx.textAlign = 'center';
  ctx.fillText('QTY', GAME_W*0.52, contentTop + 12);
  ctx.fillText('EACH', GAME_W*0.67, contentTop + 12);
  ctx.fillText('TOTAL', GAME_W*0.82, contentTop + 12);
  ctx.textAlign = 'left';

  // Divider
  ctx.strokeStyle = '#2a1f3a'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(8, contentTop + 15); ctx.lineTo(GAME_W - 8, contentTop + 15); ctx.stroke();

  const listStartY = contentTop + 18;

  // Clip list to above sell-all button
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, listStartY, GAME_W, listBottom - listStartY);
  ctx.clip();

  state.inventory.forEach((entry, i) => {
    const ry = listStartY + i * rowH - state.shopScrollY;
    if (ry + rowH < listStartY || ry > listBottom) return;

    // Row bg alternating
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.15)';
    ctx.fillRect(0, ry, GAME_W, rowH);

    // Fish icon (mini fish shape)
    ctx.save();
    ctx.translate(20, ry + rowH/2);
    drawMiniFish(entry.type.color, entry.type.size);
    ctx.restore();

    // Fish name
    ctx.fillStyle = '#e8d8f8';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(entry.type.name, 36, ry + rowH/2 - 3);

    // Zone badge
    const zoneCols = ['#2ecc71','#f39c12','#e74c3c'];
    const zoneNames = ['Shallow','Mid','Deep'];
    ctx.fillStyle = zoneCols[entry.type.zone] + '44';
    drawRoundRect(36, ry + rowH/2 + 2, 36, 9, 2, zoneCols[entry.type.zone] + '33', zoneCols[entry.type.zone] + '88', 0.5);
    ctx.fillStyle = zoneCols[entry.type.zone];
    ctx.font = '5px monospace';
    ctx.fillText(zoneNames[entry.type.zone], 38, ry + rowH/2 + 9);

    // Count
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`×${entry.count}`, GAME_W*0.52, ry + rowH/2 + 4);

    // Per-fish value with supply/demand indicator
    const val = fishScaleValue({ type: entry.type });
    const baseVal = entry.type.scales;
    const discounted = val < baseVal;
    ctx.fillStyle = discounted ? '#ff9f43' : '#ffd700';
    ctx.font = 'bold 9px monospace';
    ctx.fillText(`${val}⚡`, GAME_W*0.67, ry + rowH/2 + 4);
    if (discounted) {
      ctx.fillStyle = '#ff9f43';
      ctx.font = '5px monospace';
      ctx.fillText('LOW DEMAND', GAME_W*0.64, ry + rowH/2 + 12);
    }

    // Total
    ctx.fillStyle = '#aaffaa';
    ctx.font = 'bold 9px monospace';
    ctx.fillText(`${val * entry.count}`, GAME_W*0.82, ry + rowH/2 + 4);

    // Sell-one button
    const btnX = GAME_W - 82;
    const btnW = 76;
    const btnY2 = ry + 6;
    const btnH = rowH - 12;
    const hovCol = 'rgba(255,180,0,0.2)';
    drawRoundRect(btnX, btnY2, btnW, btnH, 4, hovCol, '#ffd700', 1);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 7px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SELL ×1', btnX + btnW/2, btnY2 + btnH/2 + 3);

    // Row bottom divider
    ctx.strokeStyle = '#1e1530';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(0, ry + rowH - 0.5); ctx.lineTo(GAME_W, ry + rowH - 0.5); ctx.stroke();

    ctx.textAlign = 'left';
  });

  ctx.restore(); // unclip

  // Sell All bar — pinned at bottom
  let total = 0;
  state.inventory.forEach(e => total += fishScaleValue({type:e.type}) * e.count);

  // Bar bg
  const sellBarY = GAME_H - 36;
  ctx.fillStyle = '#0d0718';
  ctx.fillRect(0, sellBarY - 4, GAME_W, 40);
  ctx.strokeStyle = '#2a1f3a'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, sellBarY-4); ctx.lineTo(GAME_W, sellBarY-4); ctx.stroke();

  // Total label
  ctx.fillStyle = '#887799';
  ctx.font = '7px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('TOTAL VALUE', 12, sellBarY + 8);
  ctx.fillStyle = '#aaffaa';
  ctx.font = 'bold 12px monospace';
  ctx.fillText(`${total} ⚡`, 12, sellBarY + 22);

  // Sell All button
  const saBtnX = GAME_W / 2 - 10;
  const saBtnW = GAME_W / 2 + 2;
  drawRoundRect(saBtnX, sellBarY - 1, saBtnW, 32, 5, '#c8960a', '#ffd700', 1.5);
  // Inner shine
  ctx.fillStyle = 'rgba(255,255,200,0.12)';
  drawRoundRect(saBtnX + 3, sellBarY + 1, saBtnW - 6, 12, 3, 'rgba(255,255,200,0.12)', 'transparent');
  ctx.fillStyle = '#1a0c00';
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`SELL ALL  ${total} ⚡`, saBtnX + saBtnW/2, sellBarY + 20);
  ctx.textAlign = 'left';
}

function drawMiniFish(color, size) {
  const s = Math.min(size, 10);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, 0, s, s*0.55, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s, 0);
  ctx.lineTo(-s-s*0.6, -s*0.4);
  ctx.lineTo(-s-s*0.6, s*0.4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(s*0.45, -s*0.1, s*0.2, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(s*0.5, -s*0.1, s*0.1, 0, Math.PI*2);
  ctx.fill();
}

function drawShopUpgradesPanel(contentTop) {
  const catNames = ['boat','spells','outfits'];
  const catMeta = {
    boat:    { label:'⚓  BOAT',     color:'#4fc3f7', icon:'⚓' },
    spells:  { label:'🔥 SPELLS',   color:'#ff9f43', icon:'🔥' },
    outfits: { label:'🧙 OUTFITS',  color:'#b87fff', icon:'🧙' },
  };

  let rowY = contentTop + 4 - state.shopScrollY;
  const rowH = 38;

  catNames.forEach(cat => {
    const meta = catMeta[cat];
    const catUpgs = UPGRADES.filter(u => u.category === cat);

    // Category header
    if (rowY + 26 > contentTop && rowY < GAME_H) {
      ctx.fillStyle = meta.color + '22';
      ctx.fillRect(0, rowY, GAME_W, 26);
      ctx.strokeStyle = meta.color + '55';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, rowY); ctx.lineTo(GAME_W, rowY); ctx.stroke();

      ctx.fillStyle = meta.color;
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(meta.label, 12, rowY + 17);

      // Owned count
      const owned = catUpgs.filter(u => state.ownedUpgrades.includes(u.id)).length;
      ctx.fillStyle = '#554466';
      ctx.font = '6px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(`${owned}/${catUpgs.length} owned`, GAME_W - 12, rowY + 17);
    }
    rowY += 26;

    catUpgs.forEach(upg => {
      const isOwned    = state.ownedUpgrades.includes(upg.id);
      const isUnlocked = upgradeUnlocked(upg);
      const canAfford  = state.scales >= upg.cost;

      if (rowY + rowH > contentTop && rowY < GAME_H) {
        // Row bg
        const rowBg = isOwned
          ? 'rgba(0,180,80,0.1)'
          : !isUnlocked
            ? 'rgba(40,30,50,0.6)'
            : 'rgba(255,255,255,0.04)';
        ctx.fillStyle = rowBg;
        ctx.fillRect(0, rowY, GAME_W, rowH);

        // Left accent bar
        ctx.fillStyle = isOwned ? '#2ecc71' : !isUnlocked ? '#333' : meta.color + '88';
        ctx.fillRect(0, rowY, 3, rowH);

        // Upgrade name
        ctx.fillStyle = isOwned ? '#7fffc4' : !isUnlocked ? '#55446677' : '#e8d8f8';
        ctx.font = `bold 9px monospace`;
        ctx.textAlign = 'left';
        ctx.fillText(upg.name, 12, rowY + 14);

        // Description
        ctx.fillStyle = isOwned ? '#2ecc71' : !isUnlocked ? '#443355' : '#887799';
        ctx.font = '7px monospace';
        ctx.fillText(upg.desc, 12, rowY + 26);

        // Right side: button or status
        if (isOwned) {
          // Owned badge
          ctx.fillStyle = 'rgba(0,200,80,0.2)';
          drawRoundRect(GAME_W-88, rowY+8, 80, 22, 4, 'rgba(0,180,80,0.2)', '#2ecc71', 1);
          ctx.fillStyle = '#2ecc71';
          ctx.font = 'bold 8px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('✓  OWNED', GAME_W-48, rowY+22);

        } else if (!isUnlocked) {
          ctx.fillStyle = '#443355';
          ctx.font = '6px monospace';
          ctx.textAlign = 'right';
          ctx.fillText(`🔒 Need: ${upg.requires}`, GAME_W-10, rowY+20);

        } else {
          // Buy button
          const bCol = canAfford ? '#c8960a' : '#332244';
          const tCol = canAfford ? '#1a0c00' : '#554466';
          drawRoundRect(GAME_W-92, rowY+6, 84, 26, 4, bCol, canAfford?'#ffd700':'#443355', 1);
          if (canAfford) {
            ctx.fillStyle = 'rgba(255,255,200,0.15)';
            drawRoundRect(GAME_W-89, rowY+7, 78, 10, 3, 'rgba(255,255,200,0.15)', 'transparent');
          }
          ctx.fillStyle = tCol;
          ctx.font = 'bold 8px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(`${upg.cost} ⚡`, GAME_W-50, rowY+17);
          ctx.font = '6px monospace';
          ctx.fillText(canAfford ? 'TAP TO BUY' : 'need more ⚡', GAME_W-50, rowY+27);
        }

        // Divider
        ctx.strokeStyle = '#1e1530'; ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(0, rowY+rowH-0.5); ctx.lineTo(GAME_W, rowY+rowH-0.5); ctx.stroke();

        ctx.textAlign = 'left';
      }
      rowY += rowH;
    });
    rowY += 6;
  });

  // Scales footer
  const footY = GAME_H - 22;
  ctx.fillStyle = '#0d0718';
  ctx.fillRect(0, footY - 2, GAME_W, 24);
  ctx.strokeStyle = '#2a1f3a'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, footY-2); ctx.lineTo(GAME_W, footY-2); ctx.stroke();
  ctx.fillStyle = '#554466';
  ctx.font = '7px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('YOUR SCALES:', 12, footY + 14);
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`${state.scales} ⚡`, GAME_W - 12, footY + 14);
  ctx.textAlign = 'left';
}

// ============================================================
// MAIN LOOP
// ============================================================
function loop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 16.67, 3);
  lastTime = timestamp;

  update(dt);

  ctx.clearRect(0,0,GAME_W,GAME_H);
  drawSky();
  drawClouds();
  drawShore();
  drawOcean();
  drawFish();
  drawParticles();
  drawBoat();
  drawFireball();
  drawDamageNumbers();
  drawUI();
  drawShop();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
