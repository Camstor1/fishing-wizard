<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fishing Wizard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;
user-select:none;position:fixed;top:0;left:0}
canvas{display:block;width:100vw;height:100vh;
image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// =====================================================
//  FISHING WIZARD — Phase 1.1
//  Boat · Sea · UI Bar · Touch Movement
// =====================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 270;
const H = 480;
canvas.width = W;
canvas.height = H;
ctx.imageSmoothingEnabled = false;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function canvasPos(cx, cy) {
    const r = canvas.getBoundingClientRect();
    return { x: (cx - r.left) * (W / r.width), y: (cy - r.top) * (H / r.height) };
}

const UI_H = 30;
const WATER_Y = 140;
const WORLD_W = 1600;
const SEA_FLOOR_Y = H - 30;
const BTN_SIZE = 44;
const BTN_PAD = 12;

const state = {
    time: 0,
    camX: 0,
    hp: 100,
    maxHp: 100,
    fish: 0,
    fishCap: 10,
    scales: 0,
    boat: {
        x: 200,
        y: WATER_Y - 11,
        w: 48,
        h: 20,
        speed: 1.4,
        bobOffset: 0
    },
    clouds: [],
    weeds: [],
    sandDetails: [],
    leftBtnDown: false,
    rightBtnDown: false,
    leftTouchId: null,
    rightTouchId: null
};

function initWorld() {
    for (let i = 0; i < 12; i++) {
        state.clouds.push({
            x: Math.random() * WORLD_W,
            y: UI_H + 6 + Math.random() * 50,
            w: 20 + Math.random() * 40,
            h: 8 + Math.random() * 10,
            speed: 0.05 + Math.random() * 0.12,
            parallax: 0.2 + Math.random() * 0.3
        });
    }
    for (let i = 0; i < 30; i++) {
        state.weeds.push({
            x: 30 + Math.random() * (WORLD_W - 60),
            segments: 3 + Math.floor(Math.random() * 4),
            segH: 6 + Math.random() * 10,
            color: Math.random() > 0.5 ? '#2d7a1e' : '#1e6215',
            phase: Math.random() * Math.PI * 2
        });
    }
    for (let i = 0; i < 40; i++) {
        state.sandDetails.push({
            x: Math.random() * WORLD_W,
            y: SEA_FLOOR_Y + 4 + Math.random() * 16,
            r: 1 + Math.random() * 2.5,
            color: Math.random() > 0.5 ? '#c8a84e' : '#a08838'
        });
    }
}
initWorld();

function getLeftBtnRect() {
    return { x: BTN_PAD, y: H - BTN_SIZE - BTN_PAD, w: BTN_SIZE, h: BTN_SIZE };
}
function getRightBtnRect() {
    return { x: BTN_PAD + BTN_SIZE + 10, y: H - BTN_SIZE - BTN_PAD, w: BTN_SIZE, h: BTN_SIZE };
}

function ptInRect(px, py, rect) {
    return px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
}

canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    const lb = getLeftBtnRect();
    const rb = getRightBtnRect();
    for (let t of e.changedTouches) {
        const p = canvasPos(t.clientX, t.clientY);
        if (ptInRect(p.x, p.y, lb)) {
            state.leftBtnDown = true;
            state.leftTouchId = t.identifier;
        } else if (ptInRect(p.x, p.y, rb)) {
            state.rightBtnDown = true;
            state.rightTouchId = t.identifier;
        }
    }
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    for (let t of e.changedTouches) {
        if (t.identifier === state.leftTouchId) {
            state.leftBtnDown = false;
            state.leftTouchId = null;
        }
        if (t.identifier === state.rightTouchId) {
            state.rightBtnDown = false;
            state.rightTouchId = null;
        }
    }
}, { passive: false });

canvas.addEventListener('touchcancel', function(e) {
    state.leftBtnDown = false;
    state.rightBtnDown = false;
    state.leftTouchId = null;
    state.rightTouchId = null;
}, { passive: false });

window.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft' || e.key === 'a') state.leftBtnDown = true;
    if (e.key === 'ArrowRight' || e.key === 'd') state.rightBtnDown = true;
});
window.addEventListener('keyup', function(e) {
    if (e.key === 'ArrowLeft' || e.key === 'a') state.leftBtnDown = false;
    if (e.key === 'ArrowRight' || e.key === 'd') state.rightBtnDown = false;
});

function update() {
    state.time++;
    const boat = state.boat;
    if (state.leftBtnDown) boat.x -= boat.speed;
    if (state.rightBtnDown) boat.x += boat.speed;
    boat.x = clamp(boat.x, boat.w / 2, WORLD_W - boat.w / 2);
    boat.bobOffset = Math.sin(state.time * 0.04) * 2.5;
    boat.y = WATER_Y - 11 + boat.bobOffset;
    state.camX = clamp(boat.x - W / 2, 0, WORLD_W - W);
    for (let c of state.clouds) {
        c.x += c.speed;
        if (c.x > WORLD_W + 50) c.x = -c.w - 10;
    }
}

function drawSky() {
    const grad = ctx.createLinearGradient(0, UI_H, 0, WATER_Y);
    grad.addColorStop(0, '#4a90d9');
    grad.addColorStop(1, '#87ceeb');
    ctx.fillStyle = grad;
    ctx.fillRect(0, UI_H, W, WATER_Y - UI_H);
}

function drawClouds() {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (let c of state.clouds) {
        const sx = c.x - state.camX * c.parallax;
        const wx = ((sx % (W + c.w + 40)) + W + c.w + 40) % (W + c.w + 40) - c.w - 20;
        ctx.beginPath();
        ctx.ellipse(wx + c.w * 0.3, c.y + c.h * 0.5, c.w * 0.3, c.h * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(wx + c.w * 0.55, c.y + c.h * 0.3, c.w * 0.3, c.h * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(wx + c.w * 0.75, c.y + c.h * 0.5, c.w * 0.25, c.h * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawWater() {
    const grad = ctx.createLinearGradient(0, WATER_Y, 0, SEA_FLOOR_Y);
    grad.addColorStop(0, '#1a6ea0');
    grad.addColorStop(0.4, '#134f78');
    grad.addColorStop(1, '#0b2040');
    ctx.fillStyle = grad;
    ctx.fillRect(0, WATER_Y, W, SEA_FLOOR_Y - WATER_Y);
    ctx.fillStyle = '#3aadd9';
    for (let x = -4; x < W + 4; x += 4) {
        const worldX = x + state.camX;
        const waveY = WATER_Y + Math.sin((worldX * 0.04) + state.time * 0.05) * 2
                     + Math.sin((worldX * 0.08) + state.time * 0.03) * 1;
        ctx.fillRect(x, waveY - 1, 4, 3);
    }
    ctx.fillStyle = 'rgba(180, 230, 255, 0.25)';
    for (let x = 0; x < W; x += 6) {
        const worldX = x + state.camX;
        const shimmer = Math.sin(worldX * 0.1 + state.time * 0.08);
        if (shimmer > 0.6) {
            ctx.fillRect(x, WATER_Y + 3, 4, 1);
        }
    }
}

function drawSeaweed() {
    for (let w of state.weeds) {
        const sx = w.x - state.camX;
        if (sx < -20 || sx > W + 20) continue;
        ctx.strokeStyle = w.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        let bx = sx;
        let by = SEA_FLOOR_Y;
        ctx.moveTo(bx, by);
        for (let s = 0; s < w.segments; s++) {
            const sway = Math.sin(state.time * 0.03 + w.phase + s * 0.8) * 4;
            by -= w.segH;
            bx += sway;
            ctx.lineTo(bx, by);
        }
        ctx.stroke();
        ctx.fillStyle = w.color;
        ctx.beginPath();
        ctx.arc(bx, by, 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawSandFloor() {
    ctx.fillStyle = '#d4a44a';
    ctx.fillRect(0, SEA_FLOOR_Y, W, H - SEA_FLOOR_Y);
    ctx.fillStyle = '#c89838';
    ctx.fillRect(0, SEA_FLOOR_Y, W, 2);
    for (let d of state.sandDetails) {
        const sx = d.x - state.camX;
        if (sx < -5 || sx > W + 5) continue;
        ctx.fillStyle = d.color;
        ctx.beginPath();
        ctx.arc(sx, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawBoat() {
    const boat = state.boat;
    const sx = boat.x - state.camX;
    const sy = boat.y;
    let tilt = 0;
    if (state.leftBtnDown) tilt = 0.06;
    if (state.rightBtnDown) tilt = -0.06;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(tilt);
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(-24, -2, 48, 12);
    ctx.fillStyle = '#6B3410';
    ctx.fillRect(-20, 10, 40, 4);
    ctx.fillStyle = '#A0522D';
    ctx.fillRect(-22, -4, 44, 4);
    ctx.fillStyle = '#7B3F12';
    ctx.fillRect(-12, 0, 2, 10);
    ctx.fillRect(4, 0, 2, 10);
    ctx.fillRect(-20, 2, 2, 8);
    ctx.fillRect(14, 2, 2, 8);
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(-1, -30, 3, 28);
    ctx.fillStyle = '#e8d8c0';
    ctx.beginPath();
    ctx.moveTo(2, -28);
    ctx.lineTo(2, -8);
    ctx.lineTo(16, -8);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#6040a0';
    ctx.fillRect(5, -20, 6, 6);
    ctx.fillStyle = '#6040a0';
    ctx.fillRect(-8, -14, 8, 10);
    ctx.fillStyle = '#f0c8a0';
    ctx.fillRect(-7, -18, 6, 5);
    ctx.fillStyle = '#4020a0';
    ctx.fillRect(-8, -22, 8, 4);
    ctx.fillRect(-6, -25, 4, 3);
    ctx.fillRect(-5, -27, 2, 2);
    ctx.restore();
}

function drawUIBar() {
    ctx.fillStyle = 'rgba(20, 12, 8, 0.85)';
    ctx.fillRect(0, 0, W, UI_H);
    ctx.fillStyle = '#8B6914';
    ctx.fillRect(0, UI_H - 2, W, 2);
    ctx.font = '8px monospace';
    ctx.textBaseline = 'middle';
    const midY = UI_H / 2;
    const hpBarX = 4;
    const hpBarW = 50;
    const hpBarH = 8;
    const hpPct = state.hp / state.maxHp;
    ctx.fillStyle = '#555';
    ctx.fillRect(hpBarX, midY - hpBarH / 2, hpBarW, hpBarH);
    ctx.fillStyle = hpPct > 0.5 ? '#44bb44' : hpPct > 0.25 ? '#ccaa22' : '#cc3333';
    ctx.fillRect(hpBarX + 1, midY - hpBarH / 2 + 1, (hpBarW - 2) * hpPct, hpBarH - 2);
    ctx.fillStyle = '#fff';
    ctx.fillText('HP', hpBarX + 2, midY + 1);
    const fishX = 62;
    ctx.fillStyle = '#66ccff';
    ctx.fillRect(fishX, midY - 3, 6, 4);
    ctx.fillRect(fishX + 6, midY - 2, 2, 2);
    ctx.fillRect(fishX - 2, midY - 2, 2, 2);
    ctx.fillStyle = '#fff';
    ctx.fillText(state.fish + '/' + state.fishCap, fishX + 12, midY + 1);
    const scX = 120;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(scX + 3, midY - 4);
    ctx.lineTo(scX + 6, midY);
    ctx.lineTo(scX + 3, midY + 4);
    ctx.lineTo(scX, midY);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffd700';
    ctx.fillText(state.scales, scX + 10, midY + 1);
    const menuX = W - 20;
    ctx.fillStyle = '#ccc';
    ctx.fillRect(menuX, midY - 5, 14, 2);
    ctx.fillRect(menuX, midY - 1, 14, 2);
    ctx.fillRect(menuX, midY + 3, 14, 2);
}

function drawArrowButtons() {
    const lb = getLeftBtnRect();
    const rb = getRightBtnRect();
    ctx.fillStyle = state.leftBtnDown ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.15)';
    ctx.fillRect(lb.x, lb.y, lb.w, lb.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.strokeRect(lb.x, lb.y, lb.w, lb.h);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.moveTo(lb.x + 12, lb.y + lb.h / 2);
    ctx.lineTo(lb.x + 30, lb.y + 10);
    ctx.lineTo(lb.x + 30, lb.y + lb.h - 10);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = state.rightBtnDown ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.15)';
    ctx.fillRect(rb.x, rb.y, rb.w, rb.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.strokeRect(rb.x, rb.y, rb.w, rb.h);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.moveTo(rb.x + rb.w - 12, rb.y + rb.h / 2);
    ctx.lineTo(rb.x + 14, rb.y + 10);
    ctx.lineTo(rb.x + 14, rb.y + rb.h - 10);
    ctx.closePath();
    ctx.fill();
}

function gameLoop() {
    update();
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawClouds();
    drawWater();
    drawSeaweed();
    drawSandFloor();
    drawBoat();
    drawUIBar();
    drawArrowButtons();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
